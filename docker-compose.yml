services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: windchill-postgres
    environment:
      POSTGRES_DB: windchill_db
      POSTGRES_USER: windchill
      POSTGRES_PASSWORD: ${DB_PASSWORD:-windchill123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - windchill-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windchill"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./windchill-backend
      dockerfile: Dockerfile
    container_name: windchill-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/windchill_db
      SPRING_DATASOURCE_USERNAME: windchill
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-windchill123}

      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false

      # Email (configure these)
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@windchill-plm.com}

      # App settings
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}

      # File storage
      FILE_STORAGE_PATH: /opt/windchill/files

      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}

    ports:
      - "8080:8080"
    volumes:
      - windchill_files:/opt/windchill/files
      - ./windchill-backend/logs:/app/logs
    networks:
      - windchill-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # React Frontend
  frontend:
    build:
      context: ./windchill-frontend
      dockerfile: Dockerfile
    container_name: windchill-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - windchill-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  windchill_files:
    driver: local

networks:
  windchill-network:
    driver: bridge
