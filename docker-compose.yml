services:

  # ── MySQL 8 Database ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: windchill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: windchill_db
      MYSQL_USER: windchill
      MYSQL_PASSWORD: ${DB_PASSWORD:-windchill123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - windchill-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "windchill", "-p${DB_PASSWORD:-windchill123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: windchill-redis
    ports:
      - "6379:6379"
    networks:
      - windchill-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ML Service (Python FastAPI) ───────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: windchill-ml-service
    ports:
      - "5000:5000"
    environment:
      MODEL_PATH: /app/models/risk_model.pkl
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ml_models:/app/models
      - ml_data:/app/data
      - ml_logs:/app/logs
    networks:
      - windchill-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Spring Boot Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./windchill-backend
      dockerfile: Dockerfile
    container_name: windchill-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      # ── Spring profile ──
      # Set SPRING_PROFILES_ACTIVE=prod in your .env on the production server.
      # Leave unset (defaults to 'dev') for local development.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # ── Database ──
      # Service name 'mysql' resolves within windchill-network.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/windchill_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=utf-8
      SPRING_DATASOURCE_USERNAME: windchill
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-windchill123}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      # ── JPA / Hibernate ──
      # Override to 'validate' in production to prevent accidental schema drift.
      # application-prod.yml already sets this to validate when profile=prod.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_SHOW_SQL: "false"

      # ── Redis ──
      # Service name 'redis' resolves within windchill-network.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"

      # ── JWT ──
      # REQUIRED in production: set JWT_SECRET in your .env file.
      # Generate: openssl rand -base64 64
      APP_JWTSECRET: ${JWT_SECRET:-windchill-dev-jwt-secret-key-please-change-this-to-a-64-bytes-minimum-value-1234567890}
      APP_JWTEXPIRATIONINMS: "86400000"

      # ── File storage ──
      FILE_STORAGE_PATH: /opt/windchill/files

      # ── Email (optional) ──
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@windchill-plm.com}

      # ── ML Service ──
      ML_SERVICE_URL: http://ml-service:5000
      ML_SERVICE_ENABLED: "true"
      ML_SERVICE_TIMEOUT: "5000"
      AI_IMPACT_ANALYSIS_ENABLED: "true"
      AI_RISK_PREDICTION_ENABLED: "true"
      AI_FALLBACK_USE_RULE_BASED: "true"

      # ── App URL (CORS) ──
      # Set APP_BASE_URL=https://yourdomain.com in .env for production.
      # This value is injected into CORS allowed-origins in application.yml.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}

    ports:
      - "8080:8080"
    volumes:
      - windchill_files:/opt/windchill/files
    networks:
      - windchill-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── React Frontend (Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./windchill-frontend
      dockerfile: Dockerfile
    container_name: windchill-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - windchill-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
    driver: local
  windchill_files:
    driver: local
  ml_models:
    driver: local
  ml_data:
    driver: local
  ml_logs:
    driver: local

networks:
  windchill-network:
    driver: bridge
