services:
  - type: web
    name: windchill-backend
    runtime: docker
    dockerfilePath: ./windchill-backend/Dockerfile
    dockerContext: ./windchill-backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: JAVA_OPTS
        value: -Xmx384m -Xms128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - key: APP_JWTSECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://windchill-plm-app.vercel.app
      - key: ML_SERVICE_URL
        value: https://windchill-ml.onrender.com

  - type: web
    name: windchill-ml
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: /app/models/risk_model.pkl
