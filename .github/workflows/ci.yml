name: CI — Build, Test, Coverage, Docker

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND: Maven compile + test + JaCoCo coverage + package
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    name: Backend (Java ${{ env.JAVA_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windchill-backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: windchill_db
          MYSQL_USER: windchill
          MYSQL_PASSWORD: windchill123
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn compile -q

      - name: Run tests with JaCoCo
        run: mvn test jacoco:report -Dspring.profiles.active=test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/windchill_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: windchill
          SPRING_DATASOURCE_PASSWORD: windchill123

      - name: Verify JaCoCo coverage gates
        run: mvn jacoco:check

      - name: Package (skip tests — already run)
        run: mvn package -DskipTests

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND: npm ci + build + test
  # ═══════════════════════════════════════════════════════════════════════════
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windchill-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: windchill-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm test -- --coverage --watchAll=false

  # ═══════════════════════════════════════════════════════════════════════════
  # ML SERVICE: install deps + train model + pytest
  # ═══════════════════════════════════════════════════════════════════════════
  ml-service:
    name: ML Service (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate training data
        run: python training/generate_training_data.py

      - name: Train model
        run: python training/train_model.py

      - name: Run tests
        run: python test_api.py

  # ═══════════════════════════════════════════════════════════════════════════
  # DOCKER: build all 3 images; push to Docker Hub on main only
  # Requires GitHub secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend, ml-service]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./windchill-backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/windchill-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/windchill-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./windchill-frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/windchill-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/windchill-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ML service image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/windchill-ml-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/windchill-ml-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
