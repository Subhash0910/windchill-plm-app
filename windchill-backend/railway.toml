[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required environment variables — set these in Railway Dashboard:
#
#   SPRING_PROFILES_ACTIVE = prod
#   SPRING_DATASOURCE_URL  = jdbc:mysql://<host>:<port>/windchill_db?...
#   SPRING_DATASOURCE_USERNAME = windchill
#   SPRING_DATASOURCE_PASSWORD = <secret>
#   SPRING_DATA_REDIS_HOST  = <upstash-host>
#   SPRING_DATA_REDIS_PORT  = 6379
#   JWT_SECRET              = <openssl rand -base64 64>
#   APP_BASE_URL            = https://windchill-plm-app.vercel.app
#   ML_SERVICE_URL          = https://<ml-service>.up.railway.app
