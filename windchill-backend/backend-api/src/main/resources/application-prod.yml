# ── Production profile overrides ──────────────────────────────────────────
# Activated when SPRING_PROFILES_ACTIVE=prod is set on your server.
# Overrides application.yml defaults for security, performance, and silence.

spring:
  jpa:
    hibernate:
      # validate = check schema matches entities but do NOT auto-alter tables.
      # Run Flyway/Liquibase migrations manually before deploying new versions.
      ddl-auto: validate
    show-sql: false

  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000

  mvc:
    cors:
      # Production: ONLY allow the real frontend domain.
      # Set APP_BASE_URL=https://yourdomain.com in your server env.
      # No localhost fallback here — intentional.
      allowed-origins: "${APP_BASE_URL:https://localhost}"
      allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

server:
  port: 8080
  error:
    # Never leak internal error details or stack traces to clients.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    root: WARN
    com.windchill: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

# Disable Swagger in production — never expose API explorer publicly.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Restrict Actuator — only /health and /info exposed, no internal details.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # show-details: never — health is only used by load balancer ping.
      show-details: never
      probes:
        enabled: true
    info:
      enabled: true
