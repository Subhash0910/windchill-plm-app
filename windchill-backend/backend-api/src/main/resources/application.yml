spring:
  application:
    name: windchill-api

  main:
    allow-bean-definition-overriding: true

  profiles:
    # Override via SPRING_PROFILES_ACTIVE env var on your server.
    # Use 'dev' locally, 'prod' for any deployed environment.
    active: ${SPRING_PROFILES_ACTIVE:dev}
    include: ai

  datasource:
    url: jdbc:mysql://mysql:3306/windchill_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=utf-8
    username: windchill
    # docker-compose overrides this via SPRING_DATASOURCE_PASSWORD.
    # The fallback below is for local bare-metal runs only — never use in prod.
    password: ${SPRING_DATASOURCE_PASSWORD:windchill123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        connection:
          provider_disables_autocommit: false
    show-sql: false
    open-in-view: false

  # Spring Boot 3 Redis config
  redis:
    host: redis
    port: 6379
    timeout: 2000
    connect-timeout: 2000
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  mvc:
    cors:
      # APP_BASE_URL is injected by docker-compose from your .env file.
      # In dev it defaults to http://localhost:3000.
      # In production set APP_BASE_URL=https://yourdomain.com in your .env.
      # The prod profile (application-prod.yml) overrides this to ONLY
      # allow APP_BASE_URL — no localhost fallback — for tighter security.
      allowed-origins: "http://localhost,http://localhost:3000,http://localhost:80,http://frontend,http://frontend:80,${APP_BASE_URL:http://localhost:3000}"
      allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
    throw-exception-if-no-handler-found: false

  web:
    resources:
      add-mappings: false

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: "text/html,text/xml,text/plain,text/css,application/javascript,application/json"
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

logging:
  level:
    root: INFO
    com.windchill: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# JWT — JwtTokenProvider reads app.jwtSecret and app.jwtExpirationInMs.
# APP_JWTSECRET env var maps to app.jwtSecret via Spring relaxed binding.
# IMPORTANT: generate a strong secret for production:
#   openssl rand -base64 64
app:
  jwtSecret: ${APP_JWTSECRET:windchill-dev-jwt-secret-key-please-change-this-to-a-64-bytes-minimum-value-1234567890}
  jwtExpirationInMs: 86400000

# Change Impact routing config (CSV usernames)
change-impact:
  senior-reviewers: "senior1,senior2"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      enabled: true
      probes:
        enabled: true
    info:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
