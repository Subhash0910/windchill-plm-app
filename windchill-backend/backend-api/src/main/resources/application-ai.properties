# AI Impact Engine Configuration

# ML Service Connection
ml.service.url=http://ml-service:5000
ml.service.enabled=true
ml.service.timeout=5000

# AI Feature Flags
ai.impact-analysis.enabled=true
ai.risk-prediction.enabled=true
ai.auto-suggestions.enabled=false

# Risk Thresholds
ai.risk.high-threshold=7.0
ai.risk.medium-threshold=4.0

# Analysis Settings
ai.analysis.max-bom-depth=10
ai.analysis.max-where-used-depth=10
ai.analysis.include-indirect-dependencies=true

# Fallback Behavior
ai.fallback.use-rule-based=true
ai.fallback.cache-predictions=true
ai.fallback.cache-ttl-seconds=3600

# Logging
logging.level.com.windchill.ai=DEBUG
