# Windchill PLM - wt.properties
# Master configuration file (mirrors PTC Windchill wt.properties)
# Auto-generated: 2026-05-06

# ---------------------------------------------------------------------------
# Service Manager
# ---------------------------------------------------------------------------
wt.services.manager=com.windchill.api.config.ServiceManager
wt.services.configuration=classpath:wt.properties

# Service registration files (comma-separated)
wt.services.files=classpath:services/partServices.xml,classpath:services/changeServices.xml,classpath:services/docServices.xml

# ---------------------------------------------------------------------------
# Lifecycle Manager
# ---------------------------------------------------------------------------
wt.lifecycle.manager=com.windchill.api.config.LifecycleManager

# Lifecycle template files
wt.lifecycle.files=classpath:lifecycles/partLifecycle.xml,classpath:lifecycles/documentLifecycle.xml,classpath:lifecycles/changeLifecycle.xml

# ---------------------------------------------------------------------------
# Event Manager
# ---------------------------------------------------------------------------
wt.event.manager=com.windchill.api.config.EventManager

# Event listener registration files
wt.listeners.files=classpath:listeners/partListeners.xml,classpath:listeners/changeListeners.xml

# ---------------------------------------------------------------------------
# Type Definitions
# ---------------------------------------------------------------------------
wt.types.files=classpath:types/partTypes.xml,classpath:types/docTypes.xml

# ---------------------------------------------------------------------------
# Notification Settings
# ---------------------------------------------------------------------------
wt.notification.enabled=true
wt.notification.defaultSender=system@windchill-plm.local

# ---------------------------------------------------------------------------
# Audit Settings
# ---------------------------------------------------------------------------
wt.audit.enabled=true
wt.audit.async=true

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
wt.security.jwt.issuer=windchill-plm
wt.security.jwt.expiration=86400000
